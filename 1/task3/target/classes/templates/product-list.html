<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление товара</title>
    <!-- Подключение внешних стилей из папки static/css/ -->
    <link rel="stylesheet" href="style/c.css" />
</head>
<body>

    <div class="form-container">
        <h2>Добавить новый товар</h2>
        
        <form th:action="@{/products/add}" th:object="${product}" method="post">
            
            <div class="form-group">
                <label for="name">Название товара:</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Введите название" required />
            </div>

            <div class="form-group">
                <label for="price">Цена:</label>
                <input type="number" id="price" step="0.01" th:field="*{price}" placeholder="0.00" required />
            </div>

            <div class="form-group">
                <label for="description">Описание:</label>
                <textarea id="description" th:field="*{description}" placeholder="Введите описание товара"></textarea>
            </div>

            <button type="submit" class="btn-submit">Сохранить товар</button>
        </form>

        <a th:href="@{/products}" class="link-back">Вернуться к списку</a>
    </div>

</body>
</html>
